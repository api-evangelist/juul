aid: juul
name: JUUL
description: 'JUUL Labs is the San Francisco-headquartered maker of the JUUL vaporizer, a closed-system
  electronic nicotine delivery system (ENDS) sold to adult smokers in the United States, the United Kingdom,
  Canada and a small number of other regulated markets. The company designs and manufactures the JUUL
  device and its JUULpod cartridges, operates the age-verified direct-to-consumer storefront at juul.com,
  and pursues FDA Premarket Tobacco Product Application (PMTA) authorization for its products. JUUL Labs
  is a consumer hardware and regulated tobacco-products company, not a software vendor: it publishes no
  public API, no developer portal, and no machine-readable API contract. Its engineering organization
  does maintain a real, actively-released open source presence under the JuulLabs GitHub organization
  — Kotlin Multiplatform libraries for Bluetooth Low Energy (Kable), CoAP (koap), canvas drawing (krayon),
  logging (khronicle) and general utilities (tuulbox), published to Maven Central under the com.juul.*
  group IDs — and it serves a real OAuth 2.0 / OpenID Connect discovery document from its consumer commerce
  host for its own first-party web and mobile sign-in.'
